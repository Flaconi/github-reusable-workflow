---
name: Release Drafter

on:
  workflow_call:
  push:
    branches:
      - master

jobs:
  update_release_draft:
    runs-on: ubuntu-latest
    steps:
      - uses: release-drafter/release-drafter@v7
        env:
          # callers pass REPO_READ_TOKEN via `secrets: inherit`, so drafts are authored by bot-shop-ci
          GITHUB_TOKEN: ${{ secrets.REPO_READ_TOKEN || secrets.GITHUB_TOKEN }}
