---
# Public mirror of Flaconi/github-actions publish-node.yml (with its yarn-publish and
# yarn-pre-publish actions inlined), for public repositories, which can't call reusable workflows
# from that private repository. Keep the inputs and behaviour in sync with the original.
#
# Publishing uses npm Trusted Publishing (OIDC): the package's Trusted Publisher must name the
# calling repository and its workflow file (e.g. release.yml).
name: Publish Node

on:
  workflow_call:
    inputs:
      node_version:
        type: string
        default: '24'
      working_dir:
        default: .
        type: string
        description: optional a working dir where to run the install
      yarn_command:
        type: string
        required: false
        description: yarn command to run before publish
      version:
        default: ''
        type: string
        required: false
      branch:
        default: master
        type: string
        required: false
      pre_release:
        default: false
        type: boolean
        description: is it a pre release run
      yarn_command_post_version:
        type: string
        required: false
        description: optional yarn command to run after a version in package.json was set

jobs:
  publish:
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    # do not publish again if the push came from the bot-shop-ci, also don't publish if the branch is not the default branch and it is a dependabot action, as otherwise the branch can not be merged automatically
    # master will be still published
    if: (github.event.pusher.name != 'bot-shop-ci' && github.actor != 'dependabot[bot]')
      || (github.actor == 'dependabot[bot]' &&  endsWith(github.ref,github.event.repository.default_branch))
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          show-progress: false
          # pushing with the bot token (not GITHUB_TOKEN) makes the version commit trigger CI and lets
          # bot-shop-ci bypass branch rulesets; repos without REPO_READ_TOKEN fall back to GITHUB_TOKEN,
          # which can push the beta version commit to a branch but not to a protected default branch
          token: ${{ secrets.REPO_READ_TOKEN || github.token }}
      - name: Set output
        id: vars
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ "${VERSION}" != "" ]]; then
            echo "tag=${VERSION}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/*/}" >> "$GITHUB_OUTPUT"
          fi
      - name: Import GPG key
        id: import_gpg
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        with:
          gpg_private_key: ${{ secrets.GPG_BOT_PRIVATE_KEY }}
          git_user_signingkey: true
          git_commit_gpgsign: true
      - name: install
        uses: Engerim/github-reusable-workflow/.github/actions/yarn-install@npm-public-workflows # TODO: back to @v1 before merge
        with:
          npm_token: ${{ secrets.NPM_TOKEN }}
          node_version: ${{ inputs.node_version }}
          working_dir: ${{ inputs.working_dir }}
      - name: run yarn command
        if: inputs.yarn_command
        run: yarn ${{ inputs.yarn_command }}
        shell: bash
        working-directory: ${{ inputs.working_dir }}
      - name: Set version to release tag 📝
        id: releaseVersion
        shell: bash
        env:
          TAG: ${{ steps.vars.outputs.tag }}
        run: |
          # TAG is either a tag (v1.2.3) or npm version arguments (--preid beta.1 prerelease), so it is not quoted
          # shellcheck disable=SC2086
          version=$(npm version --allow-same-version --no-commit-hooks --no-git-tag-version ${TAG})
          echo "version=${version#v}" >> "$GITHUB_OUTPUT"
        working-directory: ${{ inputs.working_dir }}
      - name: run yarn command post version
        if: inputs.yarn_command_post_version
        run: yarn ${{ inputs.yarn_command_post_version }}
        shell: bash
        working-directory: ${{ inputs.working_dir }}
      - name: Push version changes to main branch 📤
        uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v7.2.0
        with:
          commit_message: 'chore: release ${{ steps.releaseVersion.outputs.version }}'
          branch: ${{ inputs.branch }}
          file_pattern: ${{ format('{0}/package.json', inputs.working_dir) }}
          commit_user_name: bot-shop-ci
          commit_user_email: bot-shop-ci@flaconi.de
          commit_author: bot-shop-ci <bot-shop-ci@flaconi.de>
          commit_options: --no-verify --signoff -S
      - name: Publish 🚀
        shell: bash
        env:
          PRE_RELEASE: ${{ inputs.pre_release }}
        run: |
          # that forces that all releases of npm packages are done via oidc token
          yarn config unset npmAuthToken
          if [[ "${PRE_RELEASE}" == "true" ]]; then
              yarn npm publish --tag beta
          else
              yarn npm publish
          fi
        working-directory: ${{ inputs.working_dir }}
